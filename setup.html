<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>枪战 · 云端配置脚本</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0f18;color:#e8eefc;font-family:-apple-system,"PingFang SC",sans-serif;padding:18px}
h1{font-size:19px;margin:4px 0 10px}h2{font-size:14px;margin:20px 0 6px;color:#2be0b7}p{font-size:13px;color:#8fa3c4;line-height:1.7;margin:6px 0}
.btn{display:block;width:100%;padding:14px;margin:10px 0;border:none;border-radius:12px;background:#2be0b7;color:#03221c;font-size:16px;font-weight:700}
.btn.ok{background:#7ef0c4}
pre{background:#111a29;border:1px solid rgba(90,140,200,.22);border-radius:12px;padding:12px;font-size:11px;line-height:1.55;overflow-x:auto;white-space:pre;color:#b8cbe6;max-height:320px}
</style></head><body>
<h1>枪战 · 云端配置脚本</h1>
<p>两段分开跑，各复制各的。打开 Supabase → SQL Editor → New query → 粘贴 → Run，看到 Success 就好（跑过一次再点也不会出错）。</p>
<h2>① 账号表（已经跑过可跳过）</h2>
<button class="btn" id="c1">复制账号表 SQL</button>
<pre id="p1"></pre>
<h2>② 终端配置上云（这次要跑的）</h2>
<button class="btn" id="c2">复制终端配置 SQL</button>
<pre id="p2"></pre>
<script>
const S1 = `-- 枪战：云端账号表 + 只暴露校验函数（匿名角色不能直接读表）
create table if not exists public.accounts(
  name_key text primary key,
  name text not null,
  salt text not null,
  hash text not null,
  uid text not null,
  updated_at timestamptz not null default now()
);
alter table public.accounts enable row level security;

create or replace function public.acc_register(p_name text, p_salt text, p_hash text, p_uid text)
returns jsonb language plpgsql security definer set search_path = public as $$
declare k text := lower(trim(p_name));
begin
  if length(k) < 2 or length(k) > 10 then return jsonb_build_object('ok', false, 'err', 'bad_name'); end if;
  if length(p_salt) < 8 or length(p_hash) < 16 then return jsonb_build_object('ok', false, 'err', 'bad_hash'); end if;
  if exists(select 1 from accounts where name_key = k) then return jsonb_build_object('ok', false, 'err', 'name_taken'); end if;
  insert into accounts(name_key, name, salt, hash, uid) values (k, trim(p_name), p_salt, p_hash, p_uid);
  return jsonb_build_object('ok', true);
exception when unique_violation then return jsonb_build_object('ok', false, 'err', 'name_taken');
end $$;

create or replace function public.acc_salt(p_name text)
returns jsonb language plpgsql security definer set search_path = public as $$
begin
  return coalesce((select jsonb_build_object('ok', true, 'salt', salt) from accounts where name_key = lower(trim(p_name))), jsonb_build_object('ok', false, 'err', 'no_account'));
end $$;

create or replace function public.acc_login(p_name text, p_hash text)
returns jsonb language plpgsql security definer set search_path = public as $$
begin
  return coalesce((select jsonb_build_object('ok', true, 'uid', uid, 'name', name) from accounts where name_key = lower(trim(p_name)) and hash = p_hash), jsonb_build_object('ok', false, 'err', 'bad_pwd'));
end $$;

create or replace function public.acc_changepwd(p_name text, p_old text, p_salt text, p_hash text)
returns jsonb language plpgsql security definer set search_path = public as $$
begin
  if not exists(select 1 from accounts where name_key = lower(trim(p_name)) and hash = p_old) then return jsonb_build_object('ok', false, 'err', 'bad_pwd'); end if;
  update accounts set salt = p_salt, hash = p_hash, updated_at = now() where name_key = lower(trim(p_name));
  return jsonb_build_object('ok', true);
end $$;

grant execute on function public.acc_register(text,text,text,text) to anon;
grant execute on function public.acc_salt(text) to anon;
grant execute on function public.acc_login(text,text) to anon;
grant execute on function public.acc_changepwd(text,text,text,text) to anon;
`;
const S2 = `-- 终端配置上云：公告 / 封禁 / 对局参数（只有带口令的调用能写）
create table if not exists public.admin_cfg(
  k text primary key,
  v jsonb not null,
  updated_at timestamptz not null default now()
);
alter table public.admin_cfg enable row level security;

create table if not exists public.admin_secret(t text primary key);
alter table public.admin_secret enable row level security;
insert into public.admin_secret(t) values ('liuweijun2026') on conflict do nothing;

create or replace function public.cfg_get(p_key text) returns jsonb
language sql security definer set search_path = public as $$
  select v from admin_cfg where k = p_key;
$$;

create or replace function public.cfg_set(p_key text, p_val jsonb, p_token text) returns jsonb
language plpgsql security definer set search_path = public as $$
begin
  if p_key not in ('notice','ban','ptune') then return jsonb_build_object('ok', false, 'err', 'bad_key'); end if;
  if not exists(select 1 from admin_secret where t = p_token) then return jsonb_build_object('ok', false, 'err', 'bad_token'); end if;
  insert into admin_cfg(k, v, updated_at) values (p_key, p_val, now())
    on conflict (k) do update set v = excluded.v, updated_at = now();
  return jsonb_build_object('ok', true);
end $$;

grant execute on function public.cfg_get(text) to anon;
grant execute on function public.cfg_set(text, jsonb, text) to anon;
`;
document.getElementById('p1').textContent = S1;
document.getElementById('p2').textContent = S2;
function hook(id, sql){ document.getElementById(id).addEventListener('click', async (e) => {
  const b=e.currentTarget; try{ await navigator.clipboard.writeText(sql); b.textContent='✓ 已复制，去 SQL Editor 粘贴'; b.classList.add('ok'); }
  catch(err){ b.textContent='复制失败，请长按下面代码手动选中'; } }); }
hook('c1', S1); hook('c2', S2);
</script></body></html>
